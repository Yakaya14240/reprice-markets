services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: reprice_markets
      DB_USERNAME: reprice
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      FEED_SFTP_HOST: ${FEED_SFTP_HOST:-}
      FEED_SFTP_PORT: ${FEED_SFTP_PORT:-2200}
      FEED_SFTP_USERNAME: ${FEED_SFTP_USERNAME:-}
      FEED_SFTP_PASSWORD: ${FEED_SFTP_PASSWORD:-}

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=1 --tries=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: reprice_markets
      DB_USERNAME: reprice
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
      REDIS_HOST: redis

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: reprice_markets
      MYSQL_USER: reprice
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - reprice_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  reprice_mysql:
